# Tek komutla çalıştırma:  docker compose up --build
# Arayüz: http://localhost:8080   ·   Swagger: http://localhost:8080/swagger
# Önce:  cp .env.example .env   (JWT_SECRET ve ADMIN_PASSWORD zorunludur; yoksa compose başlamaz)
# SQL Server sa parolasının varsayılanı yalnızca yerel deneme içindir; gerçek ortamda .env ile verin.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Yerel-Deneme-Parola-1!}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=LibraryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Yerel-Deneme-Parola-1!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET tanımlanmalı (en az 32 karakter)}
      Auth__AdminUsername: ${ADMIN_USERNAME:-yonetici}
      Auth__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD tanımlanmalı (en az 8 karakter)}
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      HttpsRedirection__Enabled: "false"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

volumes:
  sqldata:
