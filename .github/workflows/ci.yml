name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore LibraryApp/LibraryApp.sln
      - run: dotnet build LibraryApp/LibraryApp.sln -c Release --no-restore
      - run: dotnet test LibraryApp/LibraryApp.sln -c Release --no-build --verbosity normal
