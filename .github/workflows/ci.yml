name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Test-Parola-1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Test-Parola-1!' -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore LibraryApp/LibraryApp.sln
      - run: dotnet build LibraryApp/LibraryApp.sln -c Release --no-restore
      - name: Test (birim + SQL Server eş zamanlılık)
        env:
          BOOKTRACK_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci-Test-Parola-1!;TrustServerCertificate=True
        run: >
          dotnet test LibraryApp/LibraryApp.sln -c Release --no-build --verbosity normal
          --settings LibraryApp/coverlet.runsettings
          --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Kapsam özeti ve alt sınır
        run: |
          dosya=$(ls coverage/*/coverage.cobertura.xml | head -1)
          oran=$(grep -o 'line-rate="[0-9.]*"' "$dosya" | head -1 | grep -o '[0-9.]*')
          yuzde=$(awk -v o="$oran" 'BEGIN { printf "%.1f", o * 100 }')
          echo "### Test kapsamı: %$yuzde (satır)" >> "$GITHUB_STEP_SUMMARY"
          # Alt sınır %80; Migrations hariç mevcut oran %99 civarındadır.
          awk -v o="$oran" 'BEGIN { exit (o >= 0.80 ? 0 : 1) }' || { echo "Kapsam %80 altına düştü: %$yuzde"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: kapsam-raporu
          path: coverage/*/coverage.cobertura.xml
